<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Claude Code</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --text: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.12);
      --button-bg: #ffffff;
      --button-text: #764ba2;
    }

    :root[data-theme="dark"] {
      --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --text: #e2e8f0;
      --card-bg: rgba(255, 255, 255, 0.06);
      --button-bg: #a78bfa;
      --button-text: #0f172a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      transition: color 0.3s ease;
    }

    .card {
      max-width: 600px;
      width: 100%;
      padding: 48px 32px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 32px;
      font-size: 2.2rem;
      line-height: 1.3;
    }

    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--button-text);
      background: var(--button-bg);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    #theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 10px 18px;
      font-size: 0.95rem;
    }

    #quote {
      margin: 32px 0 0;
      min-height: 3em;
      font-size: 1.25rem;
      font-style: italic;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false">🌙 Dark mode</button>

  <main class="card">
    <h1>Hello, I’m learning Claude Code!</h1>
    <button id="quote-button" type="button">Inspire me</button>
    <p id="quote" aria-live="polite"></p>
  </main>

  <script>
    const quotes = [
      "The secret of getting ahead is getting started. — Mark Twain",
      "It always seems impossible until it’s done. — Nelson Mandela",
      "Don’t watch the clock; do what it does. Keep going. — Sam Levenson",
      "The expert in anything was once a beginner. — Helen Hayes",
      "Believe you can and you’re halfway there. — Theodore Roosevelt",
      "Small steps every day add up to big results.",
      "You don’t have to be great to start, but you have to start to be great. — Zig Ziglar",
      "Learning never exhausts the mind. — Leonardo da Vinci",
      "Mistakes are proof that you are trying.",
      "Success is the sum of small efforts, repeated day in and day out. — Robert Collier"
    ];

    const button = document.getElementById("quote-button");
    const quoteEl = document.getElementById("quote");
    let lastIndex = -1;

    button.addEventListener("click", () => {
      let index;
      do {
        index = Math.floor(Math.random() * quotes.length);
      } while (index === lastIndex);
      lastIndex = index;
      quoteEl.textContent = quotes[index];
    });

    const themeToggle = document.getElementById("theme-toggle");

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = theme;
      themeToggle.textContent = isDark ? "☀️ Light mode" : "🌙 Dark mode";
      themeToggle.setAttribute("aria-pressed", String(isDark));
    }

    let savedTheme = null;
    try {
      savedTheme = localStorage.getItem("theme");
    } catch (e) {}
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
    });
  </script>
</body>
</html>
